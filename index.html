<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiago Barbosa | .NET Developer</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding:20px;
}

.language{
    position:absolute;
    top:20px;
    right:20px;
}

.language button{
    margin-left:8px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#1e293b;
    color:white;
}

.language button:hover{
    background:#38bdf8;
    color:#0f172a;
}

.container{
    max-width:700px;
}

h1{
    font-size:52px;
    margin-bottom:10px;
}

.subtitle{
    font-size:24px;
    color:#38bdf8;
    margin-bottom:20px;
}

.description{
    font-size:18px;
    color:#94a3b8;
    line-height:1.6;
    margin-bottom:30px;
}

.links a{
    display:inline-block;
    margin:8px;
    padding:12px 20px;
    border-radius:8px;
    background:#1e293b;
    color:white;
    text-decoration:none;
}

.links a:hover{
    background:#38bdf8;
    color:#0f172a;
}

.stack{
    margin-top:25px;
    color:#94a3b8;
    font-size:15px;
}
</style>
</head>

<body>

<div class="language">
<button onclick="setLanguage('en')">
<img src="https://flagcdn.com/w20/us.png" alt="US Flag">
EN
</button>

<button onclick="setLanguage('pt')">
<img src="https://flagcdn.com/w20/br.png" alt="Brazil Flag">
PT
</button>
</div>

<div class="container">
<h1>Tiago Barbosa</h1>
<p class="subtitle" id="role"></p>
<p class="description" id="description"></p>

<div class="links">
<a href="https://github.com/TiagoBarbosaTech" target="_blank">GitHub</a>
<a href="https://www.linkedin.com/in/tiago-barbosa-nascimento/" target="_blank">LinkedIn</a>
</div>

<p class="stack" id="stack"></p>
</div>

<script>
const content = {
  en: {
    role: ".NET Developer",
    description: "Backend developer focused on APIs, clean architecture, scalable systems and business solutions using C#, ASP.NET Core and SQL Server.",
    stack: "C# • ASP.NET Core • SQL Server • REST APIs • Clean Code • Git"
  },
  pt: {
    role: "Desenvolvedor .NET",
    description: "Desenvolvedor backend focado em APIs, arquitetura limpa, sistemas escaláveis e soluções de negócio usando C#, ASP.NET Core e SQL Server.",
    stack: "C# • ASP.NET Core • SQL Server • APIs REST • Clean Code • Git"
  }
};

function setLanguage(lang){
    document.getElementById("role").innerText = content[lang].role;
    document.getElementById("description").innerText = content[lang].description;
    document.getElementById("stack").innerText = content[lang].stack;
}

setLanguage("en");
</script>

</body>
</html>
