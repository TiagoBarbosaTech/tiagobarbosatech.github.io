<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiago Barbosa | Backend Developer</title>
<meta name="description" content="Tiago Barbosa, backend developer focused on .NET, APIs, SQL Server, and maintainable business systems.">

<style>
:root {
    --bg: #0f172a;
    --panel: #162033;
    --panel-strong: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-strong: #0ea5e9;
    --line: rgba(148, 163, 184, 0.25);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

a {
    color: inherit;
}

.page {
    width: min(1080px, calc(100% - 40px));
    margin: 0 auto;
    padding: 28px 0 48px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 74px;
}

.brand {
    font-weight: 700;
    letter-spacing: 0;
}

.language {
    display: flex;
    gap: 8px;
}

.language button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    background: var(--panel-strong);
    color: var(--text);
}

.language button:hover,
.language button.active {
    background: var(--accent);
    color: var(--bg);
}

.language img {
    width: 20px;
    height: auto;
}

.hero {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
    gap: 44px;
    align-items: center;
    min-height: calc(100vh - 220px);
}

.eyebrow {
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 14px;
}

h1 {
    font-size: clamp(42px, 7vw, 72px);
    line-height: 0.98;
    margin: 0 0 18px;
}

.subtitle {
    font-size: 24px;
    color: var(--text);
    margin: 0 0 18px;
}

.description {
    max-width: 680px;
    font-size: 18px;
    color: var(--muted);
    line-height: 1.65;
    margin: 0 0 30px;
}

.links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 12px 18px;
    border-radius: 8px;
    background: var(--panel-strong);
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--line);
}

.links a.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
}

.links a:hover {
    background: var(--accent-strong);
    color: var(--bg);
}

.summary {
    border-left: 3px solid var(--accent);
    padding-left: 18px;
}

.summary p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 18px;
}

.stack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 24px;
}

.stack span,
.tag {
    color: var(--text);
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 14px;
}

section {
    padding: 56px 0 0;
}

.section-title {
    font-size: 30px;
    margin: 0 0 20px;
}

.project {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 24px;
    align-items: start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
}

.project h3 {
    font-size: 22px;
    margin: 0 0 10px;
}

.project p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 18px;
}

.project-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.project-links a {
    border-radius: 8px;
    border: 1px solid var(--line);
    padding: 10px 14px;
    text-decoration: none;
    background: var(--panel-strong);
}

.project-links a:hover {
    background: var(--accent);
    color: var(--bg);
}

.metric {
    background: var(--panel-strong);
    border-radius: 8px;
    padding: 18px;
    border: 1px solid var(--line);
}

.metric strong {
    display: block;
    font-size: 30px;
    color: var(--accent);
    margin-bottom: 6px;
}

.metric span {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
}

@media (max-width: 760px) {
    .page {
        width: min(100% - 28px, 1080px);
        padding-top: 18px;
    }

    .topbar {
        align-items: flex-start;
        margin-bottom: 42px;
    }

    .hero,
    .project {
        grid-template-columns: 1fr;
    }

    .hero {
        min-height: auto;
    }

    h1 {
        font-size: 44px;
    }
}
</style>
</head>

<body>
<main class="page">
    <header class="topbar">
        <div class="brand">Tiago Barbosa</div>
        <div class="language" aria-label="Language">
            <button type="button" onclick="setLanguage('en')" id="lang-en">
                <img src="https://flagcdn.com/w20/us.png" alt="">
                EN
            </button>
            <button type="button" onclick="setLanguage('pt')" id="lang-pt">
                <img src="https://flagcdn.com/w20/br.png" alt="">
                PT
            </button>
        </div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
        <div>
            <p class="eyebrow" id="eyebrow"></p>
            <h1 id="hero-title">Tiago Barbosa</h1>
            <p class="subtitle" id="role"></p>
            <p class="description" id="description"></p>
            <div class="links">
                <a class="primary" href="#projects" id="projects-link"></a>
                <a href="https://github.com/TiagoBarbosaTech" target="_blank" rel="noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/tiago-barbosa-nascimento/" target="_blank" rel="noreferrer">LinkedIn</a>
            </div>
            <div class="stack" id="stack" aria-label="Technology stack"></div>
        </div>

        <aside class="summary" aria-label="Professional summary">
            <p id="summary-one"></p>
            <p id="summary-two"></p>
        </aside>
    </section>

    <section id="projects" aria-labelledby="projects-title">
        <h2 class="section-title" id="projects-title"></h2>
        <article class="project">
            <div>
                <h3 id="project-title"></h3>
                <p id="project-description"></p>
                <div class="stack" id="project-stack"></div>
                <div class="project-links">
                    <a href="projects/rails-support-desk-demo/" id="demo-link"></a>
                    <a href="https://github.com/tiagobarbosatech/tiagobarbosatech.github.io/tree/main/projects/rails-support-desk-demo" target="_blank" rel="noreferrer" id="repo-link"></a>
                </div>
            </div>
            <div class="metric">
                <strong>CRUD</strong>
                <span id="project-metric"></span>
            </div>
        </article>
    </section>
</main>

<script>
const content = {
  en: {
    eyebrow: "Backend developer",
    role: ".NET Developer | APIs | Business systems",
    description: "Backend developer focused on APIs, maintainable architecture, scalable systems and practical business solutions using C#, ASP.NET Core and SQL Server.",
    projectsLink: "View projects",
    summaryOne: "11+ years working with production systems, bug fixing, support workflows, database-backed features and integrations.",
    summaryTwo: "I value clear code, calm problem solving and translating real user issues into reliable technical solutions.",
    stack: ["C#", "ASP.NET Core", "SQL Server", "REST APIs", "JavaScript", "React", "Git"],
    projectsTitle: "Featured project",
    projectTitle: "Rails Support Desk Demo",
    projectDescription: "A Ruby on Rails CRUD demo for managing support tickets. It shows MVC structure, validations, flash messages, simple filtering, seed data and a clean user flow that maps well to real SaaS support operations.",
    projectStack: ["Ruby on Rails", "SQLite", "Active Record", "ERB", "Minitest"],
    demoLink: "Open live demo",
    repoLink: "View repository",
    projectMetric: "Ticket creation, status changes and priority tracking in a small Rails application."
  },
  pt: {
    eyebrow: "Desenvolvedor backend",
    role: "Desenvolvedor .NET | APIs | Sistemas de negocio",
    description: "Desenvolvedor backend focado em APIs, arquitetura manutenivel, sistemas escalaveis e solucoes praticas de negocio usando C#, ASP.NET Core e SQL Server.",
    projectsLink: "Ver projetos",
    summaryOne: "Mais de 11 anos trabalhando com sistemas em producao, correcao de bugs, suporte, features com banco de dados e integracoes.",
    summaryTwo: "Valorizo codigo claro, resolucao tranquila de problemas e transformar necessidades reais de usuarios em solucoes tecnicas confiaveis.",
    stack: ["C#", "ASP.NET Core", "SQL Server", "APIs REST", "JavaScript", "React", "Git"],
    projectsTitle: "Projeto em destaque",
    projectTitle: "Rails Support Desk Demo",
    projectDescription: "Um demo CRUD em Ruby on Rails para gerenciar tickets de suporte. Ele mostra estrutura MVC, validacoes, mensagens flash, filtros simples, dados iniciais e um fluxo de uso parecido com operacoes reais de SaaS.",
    projectStack: ["Ruby on Rails", "SQLite", "Active Record", "ERB", "Minitest"],
    demoLink: "Abrir demo",
    repoLink: "Ver repositorio",
    projectMetric: "Criacao de tickets, mudanca de status e controle de prioridade em uma pequena aplicacao Rails."
  }
};

function renderTags(targetId, values) {
    const target = document.getElementById(targetId);
    target.innerHTML = "";
    values.forEach((value) => {
        const tag = document.createElement("span");
        tag.textContent = value;
        target.appendChild(tag);
    });
}

function setLanguage(lang) {
    const selected = content[lang];
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    document.getElementById("eyebrow").innerText = selected.eyebrow;
    document.getElementById("role").innerText = selected.role;
    document.getElementById("description").innerText = selected.description;
    document.getElementById("projects-link").innerText = selected.projectsLink;
    document.getElementById("summary-one").innerText = selected.summaryOne;
    document.getElementById("summary-two").innerText = selected.summaryTwo;
    document.getElementById("projects-title").innerText = selected.projectsTitle;
    document.getElementById("project-title").innerText = selected.projectTitle;
    document.getElementById("project-description").innerText = selected.projectDescription;
    document.getElementById("demo-link").innerText = selected.demoLink;
    document.getElementById("repo-link").innerText = selected.repoLink;
    document.getElementById("project-metric").innerText = selected.projectMetric;
    renderTags("stack", selected.stack);
    renderTags("project-stack", selected.projectStack);
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    document.getElementById("lang-pt").classList.toggle("active", lang === "pt");
}

setLanguage("en");
</script>
</body>
</html>
