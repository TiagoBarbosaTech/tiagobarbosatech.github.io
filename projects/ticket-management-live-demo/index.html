<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Management Live Demo</title>
<meta name="description" content="A polished browser demo of a ticket management CRUD workflow.">
<style>
:root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --surface-strong: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --line: #d7dee8;
    --accent: #0369a1;
    --accent-strong: #075985;
    --green: #15803d;
    --amber: #b45309;
    --red: #b91c1c;
    --blue-soft: #e0f2fe;
    --green-soft: #dcfce7;
    --amber-soft: #fef3c7;
    --red-soft: #fee2e2;
    --shadow: 0 16px 45px rgba(15, 23, 42, 0.09);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.app {
    min-height: 100vh;
    padding-left: 270px;
}

.sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 270px;
    height: 100vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: #0f172a;
    color: white;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 26px;
}

.brand {
    display: grid;
    gap: 6px;
}

.brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 800;
}

.brand strong {
    font-size: 18px;
}

.brand span,
.sidebar-label {
    color: #94a3b8;
    font-size: 13px;
}

.back-link {
    color: #bae6fd;
    text-decoration: none;
    font-weight: 700;
}

.sidebar-nav {
    display: grid;
    gap: 8px;
}

.nav-button {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 8px;
    padding: 10px 12px;
    background: transparent;
    color: white;
    cursor: pointer;
    text-align: left;
}

.nav-button.active,
.nav-button:hover {
    background: rgba(56, 189, 248, 0.14);
    border-color: rgba(56, 189, 248, 0.45);
}

.nav-count {
    min-width: 28px;
    text-align: center;
    border-radius: 999px;
    padding: 3px 8px;
    background: rgba(148, 163, 184, 0.2);
    color: #e2e8f0;
    font-size: 12px;
}

.language {
    display: flex;
    gap: 8px;
    margin-top: auto;
}

.language button {
    flex: 1;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 8px;
    padding: 9px;
    background: transparent;
    color: white;
    cursor: pointer;
}

.language button.active {
    background: #38bdf8;
    border-color: #38bdf8;
    color: #0f172a;
}

.language img {
    width: 20px;
    height: auto;
}

.main {
    min-width: 0;
    padding: 26px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 22px;
}

.eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
}

h1 {
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1;
    margin: 0 0 12px;
}

.subtitle {
    max-width: 780px;
    margin: 0;
    color: var(--muted);
    line-height: 1.55;
    font-size: 17px;
}

.top-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
}

.button,
.icon-button {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
}

.button {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    font-weight: 700;
}

.button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.button.danger {
    color: var(--red);
}

.button:hover,
.icon-button:hover {
    border-color: var(--accent);
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
}

.stat {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    color: var(--text);
}

.stat:hover,
.stat.active {
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

.stat.active {
    background: #f0f9ff;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

.stat strong {
    display: block;
    font-size: 30px;
}

.workbench {
    display: grid;
    gap: 16px;
}

.controls {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 190px 190px;
    gap: 12px;
    align-items: end;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
}

.field label {
    display: block;
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    background: white;
    color: var(--text);
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.tickets {
    display: grid;
    gap: 12px;
}

.ticket {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
}

.ticket:hover {
    box-shadow: var(--shadow);
}

.ticket h2 {
    margin: 0 0 6px;
    font-size: 19px;
}

.ticket p {
    margin: 10px 0 0;
    color: var(--muted);
    line-height: 1.5;
}

.ticket-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    color: var(--muted);
    font-size: 13px;
}

.badges,
.ticket-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.ticket-actions {
    justify-content: flex-end;
}

.badge {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 700;
}

.status-open,
.priority-low {
    background: var(--blue-soft);
    color: var(--accent-strong);
}

.status-in_progress,
.priority-normal {
    background: var(--amber-soft);
    color: var(--amber);
}

.status-resolved {
    background: var(--green-soft);
    color: var(--green);
}

.status-closed {
    background: var(--surface-strong);
    color: #475569;
}

.priority-high {
    background: #ffedd5;
    color: #c2410c;
}

.priority-urgent {
    background: var(--red-soft);
    color: var(--red);
}

.icon-button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
}

.empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
}

.notice {
    position: fixed;
    right: 22px;
    bottom: 22px;
    display: none;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--green-soft);
    color: var(--green);
    border: 1px solid #bbf7d0;
    box-shadow: var(--shadow);
    z-index: 20;
}

.notice.show {
    display: block;
}

.modal {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.48);
    z-index: 30;
}

.modal.open {
    display: grid;
}

.dialog {
    width: min(560px, 100%);
    max-height: min(760px, calc(100vh - 40px));
    overflow: auto;
    background: var(--surface);
    border-radius: 8px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 18px;
}

.dialog-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
}

.dialog h2 {
    margin: 0;
    font-size: 23px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.field.full {
    grid-column: 1 / -1;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
}

@media (max-width: 960px) {
    .app {
        padding-left: 0;
    }

    .sidebar {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
    }

    .sidebar-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .language {
        margin-top: 0;
        max-width: 220px;
    }

    .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .controls {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 640px) {
    .main {
        padding: 18px;
    }

    .topbar,
    .ticket {
        grid-template-columns: 1fr;
        display: grid;
    }

    .top-actions,
    .ticket-actions {
        justify-content: stretch;
    }

    .top-actions .button,
    .ticket-actions .button {
        width: 100%;
    }

    .stats,
    .sidebar-nav,
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">TM</div>
            <strong id="app-name">Ticket Manager</strong>
            <span id="app-caption">Live portfolio demo</span>
        </div>

        <a class="back-link" href="../../" id="back-link">Back to portfolio</a>

        <div>
            <div class="sidebar-label" id="queue-label">Queues</div>
            <nav class="sidebar-nav" id="filters" aria-label="Ticket queues"></nav>
        </div>

        <div class="language" aria-label="Language">
            <button type="button" id="lang-en">
                <img src="https://flagcdn.com/w20/us.png" alt="">
                EN
            </button>
            <button type="button" id="lang-pt">
                <img src="https://flagcdn.com/w20/br.png" alt="">
                PT
            </button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <p class="eyebrow" id="eyebrow">Support operations</p>
                <h1 id="page-title">Ticket Management Live Demo</h1>
                <p class="subtitle" id="subtitle">A polished browser version of a Rails CRUD project. Search, sort, create, edit, filter and delete support tickets while data stays local to this browser.</p>
            </div>
            <div class="top-actions">
                <a class="button" href="https://github.com/tiagobarbosatech/tiagobarbosatech.github.io/tree/main/projects/ticket-management-live-demo" target="_blank" rel="noreferrer" id="source-link">Source code</a>
                <button class="button" type="button" id="reset-button">Reset demo data</button>
                <button class="button primary" type="button" id="new-ticket-button">New ticket</button>
            </div>
        </header>

        <section class="stats" id="stats" aria-label="Ticket summary"></section>

        <section class="workbench" aria-label="Ticket workspace">
            <div class="controls">
                <div class="field">
                    <label for="search" id="search-label">Search</label>
                    <input id="search" type="search" autocomplete="off">
                </div>
                <div class="field">
                    <label for="priority-filter" id="priority-filter-label">Priority</label>
                    <select id="priority-filter"></select>
                </div>
                <div class="field">
                    <label for="sort" id="sort-label">Sort</label>
                    <select id="sort"></select>
                </div>
            </div>

            <div class="tickets" id="tickets"></div>
        </section>
    </main>
</div>

<div class="notice" id="notice"></div>

<div class="modal" id="ticket-modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="dialog">
        <div class="dialog-header">
            <h2 id="form-title">New ticket</h2>
            <button class="icon-button" type="button" id="close-modal" aria-label="Close">X</button>
        </div>

        <form id="ticket-form">
            <input type="hidden" id="ticket-id">
            <div class="form-grid">
                <div class="field full">
                    <label for="title" id="title-label">Title</label>
                    <input id="title" required maxlength="90">
                </div>

                <div class="field">
                    <label for="customer-email" id="email-label">Customer email</label>
                    <input id="customer-email" type="email" required>
                </div>

                <div class="field">
                    <label for="priority" id="priority-label">Priority</label>
                    <select id="priority" required></select>
                </div>

                <div class="field">
                    <label for="status" id="status-label">Status</label>
                    <select id="status" required></select>
                </div>

                <div class="field full">
                    <label for="description" id="description-label">Description</label>
                    <textarea id="description" required></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button class="button" type="button" id="cancel-button">Cancel</button>
                <button class="button primary" type="submit" id="save-button">Create ticket</button>
            </div>
        </form>
    </div>
</div>

<script>
const STORAGE_KEY = "ticket-management-live-demo:tickets";
const LANGUAGE_KEY = "ticket-management-live-demo:language";
const statuses = ["open", "in_progress", "resolved", "closed"];
const priorities = ["low", "normal", "high", "urgent"];
let currentFilter = "all";
let currentPriority = "all";
let currentSort = "newest";
let currentSearch = "";
let currentLanguage = localStorage.getItem(LANGUAGE_KEY) || "en";

const seedTickets = [

        title: "Invoice email was not delivered",
        customerEmail: "billing@example.com",
        priority: "normal",
        status: "open",
        description: "Customer reports that the invoice email did not arrive. Check delivery logs and resend if needed.",

const content = {

        appCaption: "Live portfolio demo",
        back: "Back to portfolio",

        },

            status: "Status"
        },
        notices: {
            created: "Ticket created.",
            updated: "Ticket updated.",
            deleted: "Ticket deleted.",
            restored: "Demo data restored."
        },
        empty: {

            body: "Try another queue, priority, search term or reset the demo data."
        },

                title: "Customer cannot export leads",

            },
            invoiceEmail: {

            },

            }
        }
    },
    pt: {

        appName: "Gerenciador de Tickets",

function t() {
    return content[currentLanguage];
}

function translateValue(group, value) {
    return t()[group][value] || value;
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function ticketTitle(ticket) {
    return ticket.seedKey ? t().seeds[ticket.seedKey].title : ticket.title;
}

function ticketDescription(ticket) {
    return ticket.seedKey ? t().seeds[ticket.seedKey].description : ticket.description;
}

function getTickets() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
        return [...seedTickets];
    }
    const tickets = JSON.parse(stored);
    return tickets.map((ticket) => {
        if (ticket.seedKey) return ticket;
        if (ticket.title === "Customer cannot export leads") return { ...ticket, seedKey: "exportLeads" };
        if (ticket.title === "Invoice email was not delivered") return { ...ticket, seedKey: "invoiceEmail" };
        if (ticket.title === "API token rotation completed") return { ...ticket, seedKey: "tokenRotation" };
        return ticket;
    });
}

function saveTickets(tickets) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

function showNotice(message) {
    const notice = document.getElementById("notice");
    notice.textContent = message;
    notice.classList.add("show");
    window.setTimeout(() => notice.classList.remove("show"), 2200);
}

function counts() {
    const tickets = getTickets();
    return {
        all: tickets.length,
        open: tickets.filter((ticket) => ticket.status === "open").length,
        in_progress: tickets.filter((ticket) => ticket.status === "in_progress").length,
        resolved: tickets.filter((ticket) => ticket.status === "resolved").length,
        closed: tickets.filter((ticket) => ticket.status === "closed").length,
        urgent: tickets.filter((ticket) => ticket.priority === "urgent").length
    };
}

function priorityRank(priority) {
    return { urgent: 4, high: 3, normal: 2, low: 1 }[priority] || 0;
}

function filteredTickets() {
    const query = currentSearch.trim().toLowerCase();
    return getTickets()
        .filter((ticket) => currentFilter === "all" || ticket.status === currentFilter)
        .filter((ticket) => currentPriority === "all" || ticket.priority === currentPriority)
        .filter((ticket) => {
            if (!query) return true;
            return [
                ticketTitle(ticket),
                ticket.customerEmail,
                ticketDescription(ticket)
            ].join(" ").toLowerCase().includes(query);
        })
        .sort((a, b) => {
            if (currentSort === "oldest") return new Date(a.createdAt) - new Date(b.createdAt);
            if (currentSort === "priority") return priorityRank(b.priority) - priorityRank(a.priority);
            if (currentSort === "status") return statuses.indexOf(a.status) - statuses.indexOf(b.status);
            return new Date(b.createdAt) - new Date(a.createdAt);
        });
}

function renderSelectOptions() {
    const statusSelect = document.getElementById("status");
    const prioritySelect = document.getElementById("priority");
    const priorityFilter = document.getElementById("priority-filter");
    const sortSelect = document.getElementById("sort");

    statusSelect.innerHTML = statuses.map((status) => `<option value="${status}">${translateValue("statuses", status)}</option>`).join("");
    prioritySelect.innerHTML = priorities.map((priority) => `<option value="${priority}">${translateValue("priorities", priority)}</option>`).join("");
    priorityFilter.innerHTML = ["all", ...priorities].map((priority) => `<option value="${priority}">${translateValue("priorities", priority)}</option>`).join("");
    sortSelect.innerHTML = Object.keys(t().sort).map((sort) => `<option value="${sort}">${t().sort[sort]}</option>`).join("");

    priorityFilter.value = currentPriority;
    sortSelect.value = currentSort;
}

function renderFilters() {
    const filterCounts = counts();
    const filters = document.getElementById("filters");
    const values = ["all", ...statuses];
    filters.innerHTML = values.map((value) => {
        const label = value === "all" ? t().filters.all : translateValue("statuses", value);
        const active = value === currentFilter ? " active" : "";
        return `<button class="nav-button${active}" type="button" data-filter="${value}">
            <span>${label}</span>
            <span class="nav-count">${filterCounts[value]}</span>
        </button>`;
    }).join("");
}

function renderStats() {
    const ticketCounts = counts();
    const stats = [
        ["open", ticketCounts.open],
        ["in_progress", ticketCounts.in_progress],
        ["resolved", ticketCounts.resolved],
        ["closed", ticketCounts.closed]
    ];
    document.getElementById("stats").innerHTML = stats.map(([key, value]) => `
        <button class="stat${currentFilter === key ? " active" : ""}" type="button" data-filter="${key}">
            <span>${t().stats[key]}</span>
            <strong>${value}</strong>
        </button>
    `).join("");
}

function renderTickets() {
    const container = document.getElementById("tickets");
    const tickets = filteredTickets();

    if (tickets.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <strong>${t().empty.title}</strong>
                <p>${t().empty.body}</p>
            </div>`;
        return;
    }

    container.innerHTML = tickets.map((ticket) => `
        <article class="ticket">
            <div>
                <h2>${escapeHtml(ticketTitle(ticket))}</h2>
                <div class="ticket-meta">
                    <span>${escapeHtml(ticket.customerEmail)}</span>
                    <span>${new Date(ticket.createdAt).toLocaleDateString(currentLanguage === "pt" ? "pt-BR" : "en-US")}</span>
                </div>
                <div class="badges" aria-label="Ticket labels">
                    <span class="badge status-${ticket.status}">${translateValue("statuses", ticket.status)}</span>
                    <span class="badge priority-${ticket.priority}">${translateValue("priorities", ticket.priority)}</span>
                </div>
                <p>${escapeHtml(ticketDescription(ticket))}</p>
            </div>
            <div class="ticket-actions">
                <button class="button" type="button" data-edit="${ticket.id}">${t().buttons.edit}</button>
                <button class="button danger" type="button" data-delete="${ticket.id}">${t().buttons.delete}</button>
            </div>
        </article>
    `).join("");
}

function renderAll() {
    renderFilters();
    renderStats();
    renderTickets();
}

function openModal() {
    document.getElementById("ticket-modal").classList.add("open");
    document.getElementById("title").focus();
}

function closeModal() {
    document.getElementById("ticket-modal").classList.remove("open");
}

function resetForm() {
    document.getElementById("form-title").textContent = t().formNew;
    document.getElementById("save-button").textContent = t().buttons.create;
    document.getElementById("ticket-form").reset();
    document.getElementById("ticket-id").value = "";
    document.getElementById("priority").value = "normal";
    document.getElementById("status").value = "open";
}

function newTicket() {
    resetForm();
    openModal();
}

function editTicket(id) {
    const ticket = getTickets().find((item) => item.id === id);
    if (!ticket) return;
    document.getElementById("form-title").textContent = t().formEdit;
    document.getElementById("save-button").textContent = t().buttons.save;
    document.getElementById("ticket-id").value = ticket.id;
    document.getElementById("title").value = ticketTitle(ticket);
    document.getElementById("customer-email").value = ticket.customerEmail;
    document.getElementById("priority").value = ticket.priority;
    document.getElementById("status").value = ticket.status;
    document.getElementById("description").value = ticketDescription(ticket);
    openModal();
}

function deleteTicket(id) {
    saveTickets(getTickets().filter((ticket) => ticket.id !== id));
    resetForm();
    renderAll();
    showNotice(t().notices.deleted);
}

function handleSubmit(event) {
    event.preventDefault();
    const id = document.getElementById("ticket-id").value;
    const tickets = getTickets();
    const values = {
        title: document.getElementById("title").value.trim(),
        customerEmail: document.getElementById("customer-email").value.trim(),
        priority: document.getElementById("priority").value,
        status: document.getElementById("status").value,
        description: document.getElementById("description").value.trim()
    };

    if (id) {
        const updated = tickets.map((ticket) => ticket.id === id ? { ...ticket, ...values, seedKey: undefined } : ticket);
        saveTickets(updated);
        showNotice(t().notices.updated);
    } else {
        saveTickets([{ id: crypto.randomUUID(), ...values, createdAt: new Date().toISOString() }, ...tickets]);
        showNotice(t().notices.created);
    }

    resetForm();
    closeModal();
    renderAll();
}

function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem(LANGUAGE_KEY, language);
    const selected = t();
    const selectedPriority = document.getElementById("priority").value || "normal";
    const selectedStatus = document.getElementById("status").value || "open";
    const isEditing = document.getElementById("ticket-id").value !== "";

    document.documentElement.lang = language === "pt" ? "pt-BR" : "en";
    document.title = selected.documentTitle;
    document.getElementById("app-name").textContent = selected.appName;
    document.getElementById("app-caption").textContent = selected.appCaption;
    document.getElementById("back-link").textContent = selected.back;
    document.getElementById("queue-label").textContent = selected.queueLabel;
    document.getElementById("eyebrow").textContent = selected.eyebrow;
    document.getElementById("page-title").textContent = selected.title;
    document.getElementById("subtitle").textContent = selected.subtitle;
    document.getElementById("source-link").textContent = selected.source;
    document.getElementById("reset-button").textContent = selected.reset;
    document.getElementById("new-ticket-button").textContent = selected.newTicket;
    document.getElementById("search-label").textContent = selected.labels.search;
    document.getElementById("search").placeholder = selected.placeholders.search;
    document.getElementById("priority-filter-label").textContent = selected.labels.priorityFilter;
    document.getElementById("sort-label").textContent = selected.labels.sort;
    document.getElementById("title-label").textContent = selected.labels.title;
    document.getElementById("email-label").textContent = selected.labels.email;
    document.getElementById("priority-label").textContent = selected.labels.priority;
    document.getElementById("status-label").textContent = selected.labels.status;
    document.getElementById("description-label").textContent = selected.labels.description;
    document.getElementById("cancel-button").textContent = selected.buttons.cancel;
    document.getElementById("close-modal").setAttribute("aria-label", selected.close);
    document.getElementById("lang-en").classList.toggle("active", language === "en");
    document.getElementById("lang-pt").classList.toggle("active", language === "pt");

    renderSelectOptions();
    document.getElementById("priority").value = selectedPriority;
    document.getElementById("status").value = selectedStatus;
    document.getElementById("form-title").textContent = isEditing ? selected.formEdit : selected.formNew;
    document.getElementById("save-button").textContent = isEditing ? selected.buttons.save : selected.buttons.create;
    renderAll();
}

document.getElementById("ticket-form").addEventListener("submit", handleSubmit);
document.getElementById("new-ticket-button").addEventListener("click", newTicket);
document.getElementById("cancel-button").addEventListener("click", closeModal);
document.getElementById("close-modal").addEventListener("click", closeModal);
document.getElementById("lang-en").addEventListener("click", () => setLanguage("en"));
document.getElementById("lang-pt").addEventListener("click", () => setLanguage("pt"));
document.getElementById("search").addEventListener("input", (event) => {
    currentSearch = event.target.value;
    renderTickets();
});
document.getElementById("priority-filter").addEventListener("change", (event) => {
    currentPriority = event.target.value;
    renderTickets();
});
document.getElementById("sort").addEventListener("change", (event) => {
    currentSort = event.target.value;
    renderTickets();
});
document.getElementById("reset-button").addEventListener("click", () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
    currentFilter = "all";
    currentPriority = "all";
    currentSort = "newest";
    currentSearch = "";
    document.getElementById("search").value = "";
    renderSelectOptions();
    resetForm();
    closeModal();
    renderAll();
    showNotice(t().notices.restored);
});
document.getElementById("filters").addEventListener("click", (event) => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;
    currentFilter = button.dataset.filter;
    renderAll();
});
document.getElementById("stats").addEventListener("click", (event) => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;
    currentFilter = button.dataset.filter;
    renderAll();
});
document.getElementById("tickets").addEventListener("click", (event) => {
    const editButton = event.target.closest("[data-edit]");
    const deleteButton = event.target.closest("[data-delete]");
    if (editButton) editTicket(editButton.dataset.edit);
    if (deleteButton) deleteTicket(deleteButton.dataset.delete);
});
document.getElementById("ticket-modal").addEventListener("click", (event) => {
    if (event.target.id === "ticket-modal") closeModal();
});
document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeModal();
});

renderSelectOptions();
resetForm();
setLanguage(currentLanguage);
</script>
</body>
</html>
