<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rails Support Desk Demo</title>
<meta name="description" content="A static browser demo of a Rails support ticket CRUD workflow.">
<style>
:root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-strong: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0369a1;
    --accent-strong: #075985;
    --line: #cbd5e1;
    --danger: #b91c1c;
    --success: #166534;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

.page {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 46px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 26px;
}

.top-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.language {
    display: flex;
    gap: 8px;
}

.language button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 11px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
}

.language button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.language img {
    width: 20px;
    height: auto;
}

.back {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
}

h1 {
    font-size: clamp(34px, 6vw, 56px);
    margin: 10px 0 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
    max-width: 760px;
    margin: 0;
}

.toolbar,
.panel,
.ticket {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 14px;
    margin: 28px 0 16px;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.filter,
.button {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 13px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
}

.filter.active,
.button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.button.danger {
    color: var(--danger);
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 18px;
    align-items: start;
}

.tickets {
    display: grid;
    gap: 12px;
}

.ticket {
    padding: 18px;
}

.ticket-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
}

.ticket h2 {
    font-size: 20px;
    margin: 0 0 6px;
}

.muted {
    color: var(--muted);
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
}

.tag {
    background: #e0f2fe;
    color: var(--accent-strong);
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 13px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

.panel {
    padding: 18px;
    position: sticky;
    top: 16px;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 22px;
}

label {
    display: block;
    font-weight: 700;
    margin: 13px 0 6px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    background: white;
    color: var(--text);
}

textarea {
    min-height: 132px;
    resize: vertical;
}

.notice {
    display: none;
    margin: 0 0 16px;
    padding: 12px 14px;
    border-radius: 6px;
    background: #dcfce7;
    color: var(--success);
}

.notice.show {
    display: block;
}

.empty {
    padding: 28px;
    text-align: center;
}

@media (max-width: 850px) {
    .topbar,
    .toolbar,
    .ticket-header {
        flex-direction: column;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        position: static;
    }
}
</style>
</head>
<body>
<main class="page">
    <header class="topbar">
        <div>
            <a class="back" href="../../" id="back-link">Back to portfolio</a>
            <h1 id="page-title">Rails Support Desk Demo</h1>
            <p class="subtitle" id="subtitle">A working browser version of the Rails CRUD project. Add tickets, edit status or priority, filter the queue and delete records. Data is saved locally in this browser.</p>
        </div>
        <div class="top-actions">
            <div class="language" aria-label="Language">
                <button type="button" id="lang-en">
                    <img src="https://flagcdn.com/w20/us.png" alt="">
                    EN
                </button>
                <button type="button" id="lang-pt">
                    <img src="https://flagcdn.com/w20/br.png" alt="">
                    PT
                </button>
            </div>
            <a class="button" href="https://github.com/tiagobarbosatech/tiagobarbosatech.github.io/tree/main/projects/rails-support-desk-demo" target="_blank" rel="noreferrer" id="source-link">Source code</a>
        </div>
    </header>

    <div class="notice" id="notice"></div>

    <section class="toolbar" aria-label="Ticket filters">
        <div class="filters" id="filters"></div>
        <button class="button" type="button" id="reset-button">Reset demo data</button>
    </section>

    <section class="layout">
        <div class="tickets" id="tickets"></div>

        <aside class="panel" aria-labelledby="form-title">
            <h2 id="form-title">New ticket</h2>
            <form id="ticket-form">
                <input type="hidden" id="ticket-id">

                <label for="title" id="title-label">Title</label>
                <input id="title" required maxlength="90">

                <label for="customer-email" id="email-label">Customer email</label>
                <input id="customer-email" type="email" required>

                <label for="priority" id="priority-label">Priority</label>
                <select id="priority" required></select>

                <label for="status" id="status-label">Status</label>
                <select id="status" required></select>

                <label for="description" id="description-label">Description</label>
                <textarea id="description" required></textarea>

                <div class="actions">
                    <button class="button primary" type="submit" id="save-button">Create ticket</button>
                    <button class="button" type="button" id="cancel-button">Cancel</button>
                </div>
            </form>
        </aside>
    </section>
</main>

<script>
const STORAGE_KEY = "rails-support-desk-demo:tickets";
const LANGUAGE_KEY = "rails-support-desk-demo:language";
const statuses = ["open", "in_progress", "resolved", "closed"];
const priorities = ["low", "normal", "high", "urgent"];
let currentFilter = "all";
let currentLanguage = localStorage.getItem(LANGUAGE_KEY) || "en";

const seedTickets = [
    {
        id: crypto.randomUUID(),
        seedKey: "exportLeads",
        title: "Customer cannot export leads",
        customerEmail: "ana@example.com",
        priority: "high",
        status: "in_progress",
        description: "The export button returns an error for a filtered lead list. The customer needs the CSV before the end of the day.",
        createdAt: new Date("2026-05-20T14:30:00").toISOString()
    },
    {
        id: crypto.randomUUID(),
        seedKey: "invoiceEmail",
        title: "Invoice email was not delivered",
        customerEmail: "billing@example.com",
        priority: "normal",
        status: "open",
        description: "Customer reports that the invoice email did not arrive. Check delivery logs and resend if needed.",
        createdAt: new Date("2026-05-21T09:15:00").toISOString()
    },
    {
        id: crypto.randomUUID(),
        seedKey: "tokenRotation",
        title: "API token rotation completed",
        customerEmail: "ops@example.com",
        priority: "low",
        status: "resolved",
        description: "Token rotation was completed and validated in the staging integration.",
        createdAt: new Date("2026-05-22T11:45:00").toISOString()
    }
];

const content = {
    en: {
        documentTitle: "Rails Support Desk Demo",
        back: "Back to portfolio",
        title: "Rails Support Desk Demo",
        subtitle: "A working browser version of the Rails CRUD project. Add tickets, edit status or priority, filter the queue and delete records. Data is saved locally in this browser.",
        source: "Source code",
        reset: "Reset demo data",
        formNew: "New ticket",
        formEdit: "Edit ticket",
        labels: {
            title: "Title",
            email: "Customer email",
            priority: "Priority",
            status: "Status",
            description: "Description"
        },
        buttons: {
            create: "Create ticket",
            save: "Save changes",
            cancel: "Cancel",
            edit: "Edit",
            delete: "Delete"
        },
        filters: {
            all: "All"
        },
        statuses: {
            open: "Open",
            in_progress: "In Progress",
            resolved: "Resolved",
            closed: "Closed"
        },
        priorities: {
            low: "Low",
            normal: "Normal",
            high: "High",
            urgent: "Urgent"
        },
        notices: {
            created: "Ticket created.",
            updated: "Ticket updated.",
            deleted: "Ticket deleted.",
            restored: "Demo data restored."
        },
        empty: "No tickets found for this filter.",
        seeds: {
            exportLeads: {
                title: "Customer cannot export leads",
                description: "The export button returns an error for a filtered lead list. The customer needs the CSV before the end of the day."
            },
            invoiceEmail: {
                title: "Invoice email was not delivered",
                description: "Customer reports that the invoice email did not arrive. Check delivery logs and resend if needed."
            },
            tokenRotation: {
                title: "API token rotation completed",
                description: "Token rotation was completed and validated in the staging integration."
            }
        }
    },
    pt: {
        documentTitle: "Demo Rails de Suporte",
        back: "Voltar ao portfólio",
        title: "Demo Rails de Suporte",
        subtitle: "Uma versão funcional no navegador do projeto CRUD em Rails. Crie tickets, edite status ou prioridade, filtre a fila e exclua registros. Os dados ficam salvos localmente neste navegador.",
        source: "Código fonte",
        reset: "Restaurar dados da demo",
        formNew: "Novo ticket",
        formEdit: "Editar ticket",
        labels: {
            title: "Título",
            email: "E-mail do cliente",
            priority: "Prioridade",
            status: "Status",
            description: "Descrição"
        },
        buttons: {
            create: "Criar ticket",
            save: "Salvar alterações",
            cancel: "Cancelar",
            edit: "Editar",
            delete: "Excluir"
        },
        filters: {
            all: "Todos"
        },
        statuses: {
            open: "Aberto",
            in_progress: "Em andamento",
            resolved: "Resolvido",
            closed: "Fechado"
        },
        priorities: {
            low: "Baixa",
            normal: "Normal",
            high: "Alta",
            urgent: "Urgente"
        },
        notices: {
            created: "Ticket criado.",
            updated: "Ticket atualizado.",
            deleted: "Ticket excluído.",
            restored: "Dados da demo restaurados."
        },
        empty: "Nenhum ticket encontrado para este filtro.",
        seeds: {
            exportLeads: {
                title: "Cliente não consegue exportar leads",
                description: "O botão de exportação retorna erro para uma lista filtrada de leads. O cliente precisa do CSV até o fim do dia."
            },
            invoiceEmail: {
                title: "E-mail de fatura não foi entregue",
                description: "O cliente informou que o e-mail da fatura não chegou. Verifique os logs de entrega e reenvie se necessário."
            },
            tokenRotation: {
                title: "Rotação de token da API concluída",
                description: "A rotação do token foi concluída e validada na integração de homologação."
            }
        }
    }
};

function translateValue(group, value) {
    return content[currentLanguage][group][value] || value;
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function ticketTitle(ticket) {
    return ticket.seedKey ? content[currentLanguage].seeds[ticket.seedKey].title : ticket.title;
}

function ticketDescription(ticket) {
    return ticket.seedKey ? content[currentLanguage].seeds[ticket.seedKey].description : ticket.description;
}

function getTickets() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
        return [...seedTickets];
    }
    const tickets = JSON.parse(stored);
    return tickets.map((ticket) => {
        if (ticket.seedKey) return ticket;
        if (ticket.title === "Customer cannot export leads") return { ...ticket, seedKey: "exportLeads" };
        if (ticket.title === "Invoice email was not delivered") return { ...ticket, seedKey: "invoiceEmail" };
        if (ticket.title === "API token rotation completed") return { ...ticket, seedKey: "tokenRotation" };
        return ticket;
    });
}

function saveTickets(tickets) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

function showNotice(message) {
    const notice = document.getElementById("notice");
    notice.textContent = message;
    notice.classList.add("show");
    window.setTimeout(() => notice.classList.remove("show"), 2200);
}

function renderSelectOptions() {
    const statusSelect = document.getElementById("status");
    const prioritySelect = document.getElementById("priority");
    statusSelect.innerHTML = statuses.map((status) => `<option value="${status}">${translateValue("statuses", status)}</option>`).join("");
    prioritySelect.innerHTML = priorities.map((priority) => `<option value="${priority}">${translateValue("priorities", priority)}</option>`).join("");
}

function renderFilters() {
    const filters = document.getElementById("filters");
    const values = ["all", ...statuses];
    filters.innerHTML = values.map((value) => {
        const label = value === "all" ? content[currentLanguage].filters.all : translateValue("statuses", value);
        const active = value === currentFilter ? " active" : "";
        return `<button class="filter${active}" type="button" data-filter="${value}">${label}</button>`;
    }).join("");
}

function renderTickets() {
    const container = document.getElementById("tickets");
    const tickets = getTickets()
        .filter((ticket) => currentFilter === "all" || ticket.status === currentFilter)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (tickets.length === 0) {
        container.innerHTML = `<div class="ticket empty">${content[currentLanguage].empty}</div>`;
        return;
    }

    container.innerHTML = tickets.map((ticket) => `
        <article class="ticket">
            <div class="ticket-header">
                <div>
                    <h2>${escapeHtml(ticketTitle(ticket))}</h2>
                    <div class="muted">${escapeHtml(ticket.customerEmail)}</div>
                </div>
                <div class="muted">${new Date(ticket.createdAt).toLocaleDateString(currentLanguage === "pt" ? "pt-BR" : "en-US")}</div>
            </div>
            <div class="tags">
                <span class="tag">${translateValue("statuses", ticket.status)}</span>
                <span class="tag">${translateValue("priorities", ticket.priority)}</span>
            </div>
            <p>${escapeHtml(ticketDescription(ticket))}</p>
            <div class="actions">
                <button class="button" type="button" data-edit="${ticket.id}">${content[currentLanguage].buttons.edit}</button>
                <button class="button danger" type="button" data-delete="${ticket.id}">${content[currentLanguage].buttons.delete}</button>
            </div>
        </article>
    `).join("");
}

function resetForm() {
    document.getElementById("form-title").textContent = content[currentLanguage].formNew;
    document.getElementById("save-button").textContent = content[currentLanguage].buttons.create;
    document.getElementById("ticket-form").reset();
    document.getElementById("ticket-id").value = "";
    document.getElementById("priority").value = "normal";
    document.getElementById("status").value = "open";
}

function editTicket(id) {
    const ticket = getTickets().find((item) => item.id === id);
    if (!ticket) return;
    document.getElementById("form-title").textContent = content[currentLanguage].formEdit;
    document.getElementById("save-button").textContent = content[currentLanguage].buttons.save;
    document.getElementById("ticket-id").value = ticket.id;
    document.getElementById("title").value = ticketTitle(ticket);
    document.getElementById("customer-email").value = ticket.customerEmail;
    document.getElementById("priority").value = ticket.priority;
    document.getElementById("status").value = ticket.status;
    document.getElementById("description").value = ticketDescription(ticket);
    document.getElementById("title").focus();
}

function deleteTicket(id) {
    saveTickets(getTickets().filter((ticket) => ticket.id !== id));
    resetForm();
    renderTickets();
    showNotice(content[currentLanguage].notices.deleted);
}

function handleSubmit(event) {
    event.preventDefault();
    const id = document.getElementById("ticket-id").value;
    const tickets = getTickets();
    const values = {
        title: document.getElementById("title").value.trim(),
        customerEmail: document.getElementById("customer-email").value.trim(),
        priority: document.getElementById("priority").value,
        status: document.getElementById("status").value,
        description: document.getElementById("description").value.trim()
    };

    if (id) {
        const updated = tickets.map((ticket) => ticket.id === id ? { ...ticket, ...values, seedKey: undefined } : ticket);
        saveTickets(updated);
        showNotice(content[currentLanguage].notices.updated);
    } else {
        saveTickets([{ id: crypto.randomUUID(), ...values, createdAt: new Date().toISOString() }, ...tickets]);
        showNotice(content[currentLanguage].notices.created);
    }

    resetForm();
    renderTickets();
}

function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem(LANGUAGE_KEY, language);
    const selected = content[language];
    const selectedPriority = document.getElementById("priority").value || "normal";
    const selectedStatus = document.getElementById("status").value || "open";
    const isEditing = document.getElementById("ticket-id").value !== "";
    document.documentElement.lang = language === "pt" ? "pt-BR" : "en";
    document.title = selected.documentTitle;
    document.getElementById("back-link").textContent = selected.back;
    document.getElementById("page-title").textContent = selected.title;
    document.getElementById("subtitle").textContent = selected.subtitle;
    document.getElementById("source-link").textContent = selected.source;
    document.getElementById("reset-button").textContent = selected.reset;
    document.getElementById("title-label").textContent = selected.labels.title;
    document.getElementById("email-label").textContent = selected.labels.email;
    document.getElementById("priority-label").textContent = selected.labels.priority;
    document.getElementById("status-label").textContent = selected.labels.status;
    document.getElementById("description-label").textContent = selected.labels.description;
    document.getElementById("cancel-button").textContent = selected.buttons.cancel;
    document.getElementById("lang-en").classList.toggle("active", language === "en");
    document.getElementById("lang-pt").classList.toggle("active", language === "pt");
    renderSelectOptions();
    document.getElementById("priority").value = selectedPriority;
    document.getElementById("status").value = selectedStatus;
    document.getElementById("form-title").textContent = isEditing ? selected.formEdit : selected.formNew;
    document.getElementById("save-button").textContent = isEditing ? selected.buttons.save : selected.buttons.create;
    renderFilters();
    renderTickets();
}

document.getElementById("ticket-form").addEventListener("submit", handleSubmit);
document.getElementById("cancel-button").addEventListener("click", resetForm);
document.getElementById("lang-en").addEventListener("click", () => setLanguage("en"));
document.getElementById("lang-pt").addEventListener("click", () => setLanguage("pt"));
document.getElementById("reset-button").addEventListener("click", () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
    currentFilter = "all";
    resetForm();
    renderFilters();
    renderTickets();
    showNotice(content[currentLanguage].notices.restored);
});

document.getElementById("filters").addEventListener("click", (event) => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;
    currentFilter = button.dataset.filter;
    renderFilters();
    renderTickets();
});

document.getElementById("tickets").addEventListener("click", (event) => {
    const editButton = event.target.closest("[data-edit]");
    const deleteButton = event.target.closest("[data-delete]");
    if (editButton) editTicket(editButton.dataset.edit);
    if (deleteButton) deleteTicket(deleteButton.dataset.delete);
});

renderSelectOptions();
resetForm();
setLanguage(currentLanguage);
</script>
</body>
</html>
